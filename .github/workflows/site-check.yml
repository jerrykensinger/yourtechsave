name: Site check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 11 * * *'   # daily, so stale dates and passed promo end dates surface without a push
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-site.js
